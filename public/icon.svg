<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="seoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#seoGrad)" />

  <!-- Inner subtle glow frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Search Glass & Sparkle / Analytics lines -->
  <g transform="translate(96, 96)">
    <!-- Circular magnifying lens -->
    <circle cx="130" cy="130" r="88" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    
    <!-- Sparkle star top-right of lens -->
    <path d="M 130 75 Q 130 98 150 98 Q 130 98 130 120 Q 130 98 110 98 Q 130 98 130 75 Z" fill="#34d399" />

    <!-- SEO Bars inside lens -->
    <line x1="88" y1="156" x2="88" y2="136" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" />
    <line x1="116" y1="156" x2="116" y2="118" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" />
    <line x1="144" y1="156" x2="144" y2="104" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="172" y1="156" x2="172" y2="126" stroke="#34d399" stroke-width="12" stroke-linecap="round" />

    <!-- Magnifying handle -->
    <line x1="195" y1="195" x2="276" y2="276" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    <line x1="202" y1="202" x2="260" y2="260" stroke="#34d399" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
